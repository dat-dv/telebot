services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: telegram-assistant-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      WHISPER_URL: http://127.0.0.1:8080
    volumes:
      - ./data:/app/data
